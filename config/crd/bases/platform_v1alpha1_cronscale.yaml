apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronscales.platform.milan.dev
spec:
  group: platform.milan.dev
  scope: Namespaced
  names:
    kind: CronScale
    listKind: CronScaleList
    plural: cronscales
    singular: cronscale
    shortNames:
      - csched
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Window
          type: string
          jsonPath: .status.activeWindow
        - name: Replicas
          type: integer
          jsonPath: .status.desiredReplicas
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [target, windows]
              properties:
                target:
                  type: object
                  required: [name]
                  properties:
                    kind:
                      type: string
                      enum: [Deployment, StatefulSet]
                      default: Deployment
                    name:
                      type: string
                      minLength: 1
                timezone:
                  type: string
                  default: UTC
                minReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                maxReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                suspend:
                  type: boolean
                windows:
                  type: array
                  items:
                    type: object
                    required: [name, start, end, replicas]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      start:
                        type: string
                        minLength: 1
                      end:
                        type: string
                        minLength: 1
                      replicas:
                        type: integer
                        format: int32
                        minimum: 0
            status:
              type: object
              properties:
                activeWindow:
                  type: string
                desiredReplicas:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
